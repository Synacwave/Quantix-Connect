name: Unzip Quantix Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repo contents before unzip
        run: ls -la

      - name: Unzip QuantixConnect.zip
        run: unzip -o QuantixConnect.zip -d extracted

      - name: Show extracted structure
        run: find extracted -maxdepth 3 -type f -o -type d

      - name: Move project files into repo root
        run: |
          if [ -d "extracted/quantix-connect" ]; then
            SRC="extracted/quantix-connect"
          elif [ -d "extracted/QuantixConnect" ]; then
            SRC="extracted/QuantixConnect"
          elif [ -d "extracted/Quantix Connect" ]; then
            SRC="extracted/Quantix Connect"
          else
            SRC="extracted"
          fi

          echo "Using source folder: $SRC"

          cp -r "$SRC"/* .
          cp "$SRC"/.gitignore . 2>/dev/null || true
          cp "$SRC"/README.md . 2>/dev/null || true

      - name: Remove extracted temp folder
        run: rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Quantix project from zip" || echo "No changes to commit"
          git push


name: Unzip Quantix Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repo contents before unzip
        run: ls -la

      - name: Unzip QuantixConnect.zip
        run: unzip -o QuantixConnect.zip -d extracted

      - name: Move project files into repo root
        run: |
          cp -r extracted/quantix-connect/* .
          cp extracted/quantix-connect/.gitignore . 2>/dev/null || true
          cp extracted/quantix-connect/README.md . 2>/dev/null || true

      - name: Remove extracted temp folder
        run: rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Quantix project from zip" || echo "No changes to commit"
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring / Q Tail Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glowing Cyber Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Drop Shadow Filter for a premium depth look -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.2"/>
    </filter>

    <!-- Glow Filter for Quantum Nodes -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern in the background for a high-tech vibe -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- The Core "Q" Quantum Chat Bubble Icon Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Outer Ring of the 'Q' (shaped like a futuristic message node) -->
    <path d="M 256,120 
             C 180,120 120,180 120,256 
             C 120,332 180,392 256,392 
             C 290,392 320,380 344,360 
             L 390,400 
             L 374,342 
             C 386,318 392,288 392,256 
             C 392,180 332,120 256,120 Z" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sleek inner swoosh representing the Q loop & dynamic connectivity -->
    <path d="M 210,230 
             C 210,190 290,190 290,230 
             C 290,270 210,270 210,310 
             L 330,310" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Quantum Interconnected Glowing Nodes (Neon cyan and purple dots) -->
    <!-- Node 1 (Top Left) -->
    <circle cx="190" cy="190" r="14" fill="#22d3ee" filter="url(#neonGlow)" />
    <!-- Node 2 (Center Right) -->
    <circle cx="320" cy="240" r="14" fill="#a78bfa" filter="url(#neonGlow)" />
    <!-- Node 3 (Bottom Left Connection) -->
    <circle cx="170" cy="290" r="14" fill="#38bdf8" filter="url(#neonGlow)" />
    
    <!-- Link lines between nodes (very thin, glowing) -->
    <line x1="190" y1="190" x2="250" y2="230" stroke="#22d3ee" stroke-width="4" opacity="0.6" stroke-dasharray="8 6" />
    <line x1="250" y1="230" x2="320" y2="240" stroke="#a78bfa" stroke-width="4" opacity="0.6" stroke-dasharray="8 6" />
    <line x1="170" y1="290" x2="210" y2="310" stroke="#38bdf8" stroke-width="4" opacity="0.6" />
  </g>

  <!-- Core central pulse point -->
  <circle cx="250" cy="230" r="10" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
